
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XXXゼミ・経済学部フェスタ特設ページ</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">ECONOMICS DEPARTMENT FESTA</p>
      <h1>XXXゼミ・経済学部<br>フェスタ特設ページ</h1>
      <p class="intro">
        学生たちが制作したオリジナルWebアプリをご紹介します。
        ぜひ、気になる作品を体験してみてください！
      </p>
    </div>
  </header>

  <main class="container">
    <section class="section-heading">
      <div>
        <p class="eyebrow">STUDENT WORKS</p>
        <h2>学生作品一覧</h2>
      </div>
      <p id="work-count" class="work-count"></p>
    </section>

    <div class="toolbar">
      <input
        type="search"
        id="search"
        placeholder="作品名・学生名で検索..."
        aria-label="作品を検索"
      >
      <select id="category" aria-label="カテゴリで絞り込み">
        <option value="all">すべての作品</option>
        <option value="ゲーム">ゲーム</option>
        <option value="ツール">ツール</option>
        <option value="学習">学習</option>
      </select>
    </div>

    <div id="works-list" class="works-grid"></div>

    <p id="empty-message" hidden>
      該当する作品はありません。
    </p>
  </main>

  <footer>
    <p>XXXゼミ・経済学部フェスタ</p>
  </footer>

  <script src="./js/main.js"></script>
</body>
</html>
