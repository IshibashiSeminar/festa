<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スターシューター</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#050816;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
  #wrap{position:relative;width:min(92vw,520px)}
  canvas{display:block;width:100%;height:auto;aspect-ratio:520/760;background:#03050d;border:2px solid #27345f;border-radius:14px;
         box-shadow:0 0 35px #17255e;touch-action:none}
  #hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;
       font-weight:700;text-shadow:0 2px 5px #000;pointer-events:none}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
           background:rgba(3,5,13,.72);border-radius:14px}
  #panel{padding:28px 22px}
  h1{font-size:34px;margin:0 0 8px}
  p{margin:8px 0 18px;color:#cbd4ff}
  button{border:0;border-radius:12px;padding:13px 26px;font-size:18px;font-weight:800;cursor:pointer;
         background:#5b7cff;color:white;box-shadow:0 5px 0 #3149a6}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #3149a6}
  #controls{position:absolute;left:10px;right:10px;bottom:12px;display:flex;justify-content:space-between;pointer-events:none}
  .ctrl{pointer-events:auto;width:72px;height:58px;border-radius:16px;border:1px solid #53629a;
         background:rgba(32,46,94,.75);color:white;font-size:27px;font-weight:900;touch-action:none}
  #fire{width:92px;background:rgba(145,52,89,.8)}
  .small{font-size:13px;color:#9ba8d7}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="520" height="760"></canvas>
  <div id="hud"><span id="score">SCORE 0</span><span id="lives">♥♥♥</span></div>
  <div id="overlay">
    <div id="panel">
      <h1 id="title">STAR SHOOTER</h1>
      <p id="message">← → / A D で移動　・　SPACE で発射</p>
      <button id="start">ゲーム開始</button>
      <div class="small" style="margin-top:16px">スマホ・タブレットは画面下のボタンでも操作できます</div>
    </div>
  </div>
  <div id="controls">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="fire">●</button>
    <button class="ctrl" id="right">▶</button>
  </div>
</div>

<script>
"use strict";
const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const overlay=document.getElementById("overlay"), startBtn=document.getElementById("start");
const title=document.getElementById("title"), message=document.getElementById("message");
const scoreEl=document.getElementById("score"), livesEl=document.getElementById("lives");

let state="menu", score=0, lives=3, last=0, raf=0, spawnTimer=0, shotTimer=0, invincible=0;
const keys=new Set(), bullets=[], enemies=[], particles=[], stars=[];
const player={x:W/2,y:H-75,w:34,h:38,speed:360};
for(let i=0;i<90;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2,v:30+Math.random()*80});

function resetGame(){
  score=0;lives=3;spawnTimer=0;shotTimer=0;invincible=1.2;
  bullets.length=0;enemies.length=0;particles.length=0;
  player.x=W/2;
  updateHud();
}
function updateHud(){
  scoreEl.textContent="SCORE "+score;
  livesEl.textContent="♥".repeat(lives)+"♡".repeat(3-lives);
}
function startGame(){
  resetGame(); state="playing"; overlay.style.display="none";
  cancelAnimationFrame(raf); last=performance.now(); raf=requestAnimationFrame(loop);
}
function gameOver(){
  state="gameover";
  title.textContent="GAME OVER";
  message.textContent="SCORE "+score+"　もう一度挑戦しよう！";
  startBtn.textContent="もう一度遊ぶ";
  overlay.style.display="flex";
}
function shoot(){
  if(state!=="playing" || shotTimer>0) return;
  bullets.push({x:player.x,y:player.y-22,v:620,r:4});
  shotTimer=.16;
}
function spawnEnemy(){
  const size=26+Math.random()*16;
  enemies.push({x:size+Math.random()*(W-size*2),y:-size,size,v:75+Math.random()*75,
                hp:1+Math.floor(score/500),phase:Math.random()*6.28});
}
function burst(x,y,n=10){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=40+Math.random()*180;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.5});
  }
}
function hitPlayer(){
  if(invincible>0) return;
  lives--;invincible=1.4;burst(player.x,player.y,20);updateHud();
  if(lives<=0) gameOver();
}
function circleRect(cx,cy,r,rx,ry,rw,rh){
  const x=Math.max(rx,Math.min(cx,rx+rw)), y=Math.max(ry,Math.min(cy,ry+rh));
  return (cx-x)**2+(cy-y)**2<r*r;
}
function update(dt){
  // 背景
  for(const s of stars){s.y+=s.v*dt;if(s.y>H)s.y=0}
  if(state!=="playing") return;
  invincible=Math.max(0,invincible-dt);shotTimer=Math.max(0,shotTimer-dt);
  let dx=0;if(keys.has("ArrowLeft")||keys.has("a"))dx--;if(keys.has("ArrowRight")||keys.has("d"))dx++;
  player.x+=dx*player.speed*dt;player.x=Math.max(24,Math.min(W-24,player.x));
  if(keys.has(" ")||keys.has("Spacebar")) shoot();

  spawnTimer-=dt;
  if(spawnTimer<=0){spawnEnemy();spawnTimer=Math.max(.28,.78-score/2500)}

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.y-=b.v*dt;
    if(b.y< -10){bullets.splice(i,1);continue}
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(circleRect(b.x,b.y,b.r,e.x-e.size,e.y-e.size,e.size*2,e.size*2)){
        bullets.splice(i,1);e.hp--;burst(b.x,b.y,5);
        if(e.hp<=0){score+=100;burst(e.x,e.y,14);enemies.splice(j,1);updateHud()}
        break;
      }
    }
  }
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];e.y+=e.v*dt;e.x+=Math.sin(e.phase+e.y*.018)*35*dt;
    if(e.y>H+50){enemies.splice(i,1);continue}
    if(circleRect(e.x,e.y,e.size*.75,player.x-player.w/2,player.y-player.h/2,player.w,player.h)){
      enemies.splice(i,1);hitPlayer();
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#030516");g.addColorStop(1,"#0a1030");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#fff";
  for(const s of stars){ctx.globalAlpha=.35+s.s*.2;ctx.fillRect(s.x,s.y,s.s,s.s*2)}
  ctx.globalAlpha=1;

  // bullets
  for(const b of bullets){ctx.fillStyle="#8cf4ff";ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}

  // enemies
  for(const e of enemies){
    ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.y*.004);
    ctx.fillStyle="#ff5577";ctx.beginPath();
    for(let k=0;k<8;k++){const a=k*Math.PI/4,r=k%2?e.size*.48:e.size;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
    ctx.closePath();ctx.fill();
    ctx.fillStyle="#ffd3df";ctx.beginPath();ctx.arc(-e.size*.25,-e.size*.12,3,0,7);ctx.arc(e.size*.25,-e.size*.12,3,0,7);ctx.fill();
    ctx.restore();
  }
  // player
  if(invincible<=0 || Math.floor(invincible*12)%2===0){
    ctx.save();ctx.translate(player.x,player.y);
    ctx.fillStyle="#63d7ff";ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(18,18);ctx.lineTo(0,11);ctx.lineTo(-18,18);ctx.closePath();ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,-5,5,0,7);ctx.fill();
    ctx.fillStyle="#ffb34d";ctx.beginPath();ctx.moveTo(-7,15);ctx.lineTo(0,30+Math.random()*8);ctx.lineTo(7,15);ctx.fill();
    ctx.restore();
  }
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*1.5);ctx.fillStyle="#ffd36a";ctx.fillRect(p.x-2,p.y-2,4,4)}
  ctx.globalAlpha=1;
}
function loop(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  update(dt);draw();
  if(state==="playing") raf=requestAnimationFrame(loop);
  else raf=0;
}

// Keyboard
window.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight"," ","a","d","A","D"].includes(e.key))e.preventDefault();
  keys.add(e.key);
  if(e.key==="Enter" && state!=="playing") startGame();
});
window.addEventListener("keyup",e=>keys.delete(e.key));

// Buttons use pointer events so mouse, touch and pen all work.
function holdButton(el,key){
  const down=e=>{e.preventDefault();keys.add(key)};
  const up=e=>{e.preventDefault();keys.delete(key)};
  el.addEventListener("pointerdown",down);
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,up));
}
holdButton(document.getElementById("left"),"ArrowLeft");
holdButton(document.getElementById("right"),"ArrowRight");
document.getElementById("fire").addEventListener("pointerdown",e=>{e.preventDefault();shoot();keys.add(" ")});
["pointerup","pointercancel","pointerleave"].forEach(ev=>document.getElementById("fire").addEventListener(ev,e=>{e.preventDefault();keys.delete(" ")}));
startBtn.addEventListener("click",startGame);
canvas.addEventListener("pointerdown",e=>{
  if(state==="playing"){const r=canvas.getBoundingClientRect();player.x=(e.clientX-r.left)/r.width*W;shoot()}
});
canvas.addEventListener("pointermove",e=>{
  if(state==="playing" && e.buttons){const r=canvas.getBoundingClientRect();player.x=(e.clientX-r.left)/r.width*W;player.x=Math.max(24,Math.min(W-24,player.x));shoot()}
});
draw();
</script>
</body>
</html>
