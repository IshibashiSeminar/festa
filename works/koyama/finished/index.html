<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スターシューター Stage Edition</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050816;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#wrap{position:relative;width:min(92vw,520px)}
canvas{display:block;width:100%;height:auto;aspect-ratio:520/760;background:#03050d;border:2px solid #27345f;border-radius:14px;box-shadow:0 0 35px #17255e;touch-action:none}
#hud{position:absolute;top:10px;left:12px;right:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;font-weight:800;text-shadow:0 2px 5px #000;pointer-events:none;font-size:14px}
#score{text-align:left}.stageHud{text-align:center}.timeHud{text-align:center;color:#fff;font-weight:900}.lifeHud{text-align:right}
#status{position:absolute;top:43px;left:12px;right:12px;text-align:center;font-size:12px;font-weight:700;text-shadow:0 2px 5px #000;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(3,5,13,.78);border-radius:14px;z-index:5}
#panel{padding:24px 20px;max-width:480px;width:100%}
h1{font-size:34px;margin:0 0 8px} p{margin:8px 0 14px;color:#cbd4ff}
#tutorial{margin:10px auto 12px;max-width:410px}
.tutorialTitle{font-size:15px;font-weight:900;margin-bottom:8px;color:#fff}
.demoBox{position:relative;height:132px;overflow:hidden;border:1px solid #5268b7;border-radius:14px;background:linear-gradient(#07102b,#111d49);box-shadow:inset 0 0 28px rgba(91,124,255,.18)}
.demoStars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:31px 27px;opacity:.35}
.demoShip{position:absolute;left:50%;bottom:19px;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:34px solid #63d7ff;filter:drop-shadow(0 0 8px #63d7ff);animation:demoMove 3.4s ease-in-out infinite}
.demoShip:after{content:"";position:absolute;width:5px;height:24px;background:#8cf4ff;left:-2px;top:-34px;border-radius:5px;box-shadow:0 -25px 0 #8cf4ff;animation:demoShot 1s linear infinite}
.demoEnemy{position:absolute;left:calc(50% - 12px);top:13px;font-size:25px;animation:demoEnemy 2s linear infinite}
.demoKeys{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:900;background:rgba(0,0,0,.5);padding:5px 8px;border-radius:8px}
.demoFire{position:absolute;right:10px;bottom:8px;font-size:11px;font-weight:900;background:rgba(255,70,115,.7);padding:5px 8px;border-radius:8px}
@keyframes demoMove{0%,100%{transform:translateX(-100px)}50%{transform:translateX(70px)}}
@keyframes demoShot{0%{opacity:0;transform:translateY(0)}25%{opacity:1}100%{opacity:0;transform:translateY(-65px)}}
@keyframes demoEnemy{0%{transform:translateY(0)}100%{transform:translateY(55px)}}
.guideGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px;text-align:left;font-size:12px}
.guideCard{padding:7px 9px;border-radius:9px;background:rgba(25,38,84,.85);border:1px solid #3f508d}
#resultFX{display:none;font-size:44px;margin:4px 0;animation:resultPulse .8s ease-in-out infinite alternate}
@keyframes resultPulse{to{transform:scale(1.12)}}
#overlay.clearFX{background:radial-gradient(circle,rgba(40,55,120,.72),rgba(3,5,13,.94));animation:clearGlow 1.1s ease-in-out infinite alternate}
#overlay.overFX{background:linear-gradient(rgba(45,0,12,.86),rgba(3,5,13,.96));filter:saturate(.8)}
@keyframes clearGlow{to{box-shadow:inset 0 0 100px rgba(255,224,92,.24)}}
button{border:0;border-radius:12px;padding:13px 26px;font-size:18px;font-weight:800;cursor:pointer;background:#5b7cff;color:white;box-shadow:0 5px 0 #3149a6}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #3149a6}
#controls{position:absolute;left:10px;right:10px;bottom:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:4}
.ctrl{pointer-events:auto;width:72px;height:58px;border-radius:16px;border:1px solid #53629a;background:rgba(32,46,94,.75);color:white;font-size:27px;font-weight:900;touch-action:none}
#fire{width:92px;background:rgba(145,52,89,.8)}.small{font-size:13px;color:#9ba8d7}
#skillBox{margin:14px auto 0;max-width:360px;padding:10px 12px;border:1px solid #45558e;border-radius:12px;background:rgba(20,31,70,.72);font-size:13px;color:#dce3ff}

/* Cinematic result effects */
#resultFX{position:relative;width:100%;height:125px;margin:0;display:none;overflow:visible}
.resultBig{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:1000;letter-spacing:.08em}
.clearFX #panel{animation:clearPanelIn .75s cubic-bezier(.16,.85,.25,1.25) both}
.clearFX #title{font-size:47px;background:linear-gradient(90deg,#fff6a0,#fff,#ffd85b);-webkit-background-clip:text;color:transparent;animation:clearTitle 1.1s ease-in-out infinite alternate}
.clearFX .resultBig{font-size:58px;animation:trophyDrop 1s cubic-bezier(.15,.9,.2,1.25) both}
.clearFX .ray{position:absolute;left:50%;top:50%;width:5px;height:105px;transform-origin:50% 100%;background:linear-gradient(transparent,rgba(255,238,116,.85));animation:raySpin 5s linear infinite}
.clearFX .confetti{position:fixed;top:-25px;width:9px;height:18px;border-radius:2px;animation:confettiFall var(--d) linear var(--delay) infinite;transform:rotate(var(--r))}
.clearFX .spark{position:fixed;width:7px;height:7px;border-radius:50%;background:#fff7a1;box-shadow:0 0 13px #fff2a0;animation:sparkPop 1.4s ease-out var(--delay) infinite}
@keyframes clearPanelIn{from{opacity:0;transform:scale(.7) translateY(45px)}to{opacity:1;transform:none}}
@keyframes clearTitle{to{transform:scale(1.06);filter:drop-shadow(0 0 20px #ffd85b)}}
@keyframes trophyDrop{0%{opacity:0;transform:translateY(-100px) scale(1.7) rotate(-12deg)}70%{opacity:1;transform:translateY(8px) scale(.95) rotate(4deg)}100%{transform:none}}
@keyframes raySpin{to{transform:rotate(360deg)}}
@keyframes confettiFall{0%{transform:translate3d(0,-10vh,0) rotate(0)}100%{transform:translate3d(var(--x),115vh,0) rotate(760deg)}}
@keyframes sparkPop{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.8)}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.1)}}

.overFX #panel{animation:failDrop .85s cubic-bezier(.2,.7,.2,1) both}
.overFX #title{font-size:48px;color:#ff4965;animation:failTitle 2.1s ease-in-out infinite}
.overFX .resultBig{font-size:70px;color:#ff2948;animation:warningPulse 1.25s ease-in-out infinite}
.overFX:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,0,40,.035) 6px 7px);animation:scanDown 5s linear infinite}
.overFX .failLine{position:fixed;left:-15%;width:130%;height:2px;background:linear-gradient(90deg,transparent,#ff2448,transparent);opacity:.5;animation:failSweep var(--d) linear var(--delay) infinite}
@keyframes failDrop{0%{opacity:0;transform:translateY(-35px)}45%{transform:translateY(12px)}100%{opacity:1;transform:none}}
@keyframes failTitle{0%,100%{opacity:.72;letter-spacing:.06em}50%{opacity:1;letter-spacing:.13em;text-shadow:0 0 25px #a90022}}
@keyframes warningPulse{0%,100%{opacity:.28;transform:scale(.82)}50%{opacity:1;transform:scale(1.04)}}
@keyframes scanDown{to{transform:translateY(20px)}}
@keyframes failSweep{0%{transform:translateY(-20vh)}100%{transform:translateY(120vh)}}


/* ===== HUD readability upgrade ===== */
#hud{
  position:absolute;top:10px;left:10px;right:10px;z-index:8;
  display:grid!important;
  grid-template-columns:1fr auto 1fr;
  grid-template-areas:
    "hp time score"
    "stage status status";
  align-items:center;gap:6px 10px;
  pointer-events:none;
}
#hud>span{
  background:rgba(4,10,29,.82);
  border:1px solid rgba(139,174,255,.42);
  box-shadow:0 3px 12px rgba(0,0,0,.28);
  border-radius:9px;padding:5px 9px;
  white-space:nowrap;
}
#lives{grid-area:hp;justify-self:start}
#timeHud{grid-area:time;justify-self:center;position:static!important;transform:none!important;
  font-size:18px!important;font-weight:1000;color:#fff;min-width:108px;text-align:center}
#score{grid-area:score;justify-self:end}
#stageHud{grid-area:stage;justify-self:start}
#status{grid-area:status;justify-self:end;max-width:70vw;overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){
 #hud{left:6px;right:6px;top:6px;gap:4px 6px}
 #hud>span{font-size:11px;padding:4px 6px}
 #timeHud{font-size:15px!important;min-width:88px}
 #status{max-width:62vw}
}

/* ===== Touch controls: keep them outside the rocket's play area ===== */
#touch{
  position:absolute!important;
  left:0!important;right:0!important;bottom:0!important;
  height:92px!important;
  padding:10px 14px 12px!important;
  box-sizing:border-box;
  display:flex!important;
  align-items:center!important;
  justify-content:space-between!important;
  gap:12px!important;
  z-index:12!important;
  background:linear-gradient(to top,rgba(3,7,22,.98),rgba(7,13,35,.91));
  border-top:1px solid rgba(130,165,255,.4);
  backdrop-filter:blur(5px);
}
#touch button{
  position:static!important;
  width:72px!important;height:62px!important;
  margin:0!important;
  border-radius:16px!important;
  background:rgba(30,46,94,.94)!important;
  border:1px solid rgba(150,185,255,.65)!important;
  box-shadow:0 4px 12px rgba(0,0,0,.35)!important;
  font-size:24px!important;
  opacity:1!important;
}
#touch button:last-child{
  width:105px!important;
  background:rgba(132,35,67,.95)!important;
  font-size:16px!important;font-weight:1000!important;
}
/* Reserve visual space above the controls by masking the bottom of the canvas.
   Player movement is also clamped above this strip below. */


/* === Controls completely separated from the play field === */
html,body{
  min-height:100%;
}
#wrap{
  display:flex!important;
  flex-direction:column!important;
  justify-content:flex-start!important;
  overflow:visible!important;
}
canvas{
  flex:0 0 auto;
}
#touch{
  position:relative!important;
  left:auto!important;right:auto!important;bottom:auto!important;
  width:100%!important;
  height:86px!important;
  flex:0 0 86px!important;
  margin:0!important;
  padding:10px 14px!important;
  box-sizing:border-box!important;
  z-index:20!important;
  background:#070d20!important;
  border-top:2px solid rgba(135,170,255,.55)!important;
  display:flex!important;
  justify-content:space-between!important;
  align-items:center!important;
}


/* ===== Clean HUD v2 ===== */
#hud{
  position:absolute!important;
  top:10px!important;left:10px!important;right:10px!important;
  display:grid!important;
  grid-template-columns:1fr auto 1fr!important;
  grid-template-areas:
    "hp time score"
    "status status status"!important;
  gap:7px 10px!important;
  align-items:center!important;
  z-index:10!important;
  pointer-events:none!important;
}
#hud>span{
  border:1px solid rgba(145,175,255,.36)!important;
  background:rgba(5,11,30,.80)!important;
  border-radius:10px!important;
  padding:6px 10px!important;
  box-shadow:0 3px 14px rgba(0,0,0,.28)!important;
  font-weight:850!important;
  line-height:1.15!important;
}
#lives{grid-area:hp!important;justify-self:start!important;color:#ff7795!important}
#timeHud{
  grid-area:time!important;justify-self:center!important;
  position:static!important;transform:none!important;
  min-width:112px!important;text-align:center!important;
  font-size:18px!important;color:#fff!important;
}
#score{grid-area:score!important;justify-self:end!important;color:#ffe276!important}
#status{
  grid-area:status!important;justify-self:center!important;
  max-width:90%!important;text-align:center!important;
  color:#dfe8ff!important;
  min-height:13px!important;
}
.stageHud,#stageHud,#touch{display:none!important}
@media(max-width:520px){
 #hud{top:6px!important;left:6px!important;right:6px!important;gap:5px!important}
 #hud>span{font-size:11px!important;padding:5px 7px!important}
 #timeHud{font-size:15px!important;min-width:88px!important}
 #status{max-width:96%!important}
}

</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="520" height="760"></canvas>
<div id="hud">
  <span id="score">SCORE 0</span>
<span class="timeHud" id="timeHud">TIME --</span>
  <span class="lifeHud" id="lives">♥♥♥</span>
</div>
<div id="status"></div>
<div id="overlay">
  <div id="panel">
    <h1 id="title">COSMIC STRIKER</h1>
    <div id="resultFX"></div>
    <p id="message">ロケットを動かして敵を撃破！<br>攻撃を避けながらボスを目指そう。</p>
    <div id="tutorial">
      <div class="tutorialTitle">🎮 まずは操作を見てみよう</div>
      <div class="demoBox">
        <div class="demoStars"></div><div class="demoEnemy">▼</div><div class="demoShip"></div>
        <div class="demoKeys">← → / A・D　移動</div><div class="demoFire">SPACE　発射</div>
      </div>
      <div class="guideGrid">
        <div class="guideCard">① <b>左右に移動</b><br>敵・敵弾をかわす</div>
        <div class="guideCard">② <b>SPACEで攻撃</b><br>押し続けても連射</div>
        <div class="guideCard">♥ <b>回復</b><br>ライフを1つ回復</div>
        <div class="guideCard">★ <b>無敵</b><br>6秒間ダメージ無効</div>
      </div>
    </div>
    <div id="scoreGuide" style="margin:0 auto 12px;max-width:410px;padding:9px 11px;border:1px solid #45558e;border-radius:12px;background:rgba(20,31,70,.72);font-size:12px;line-height:1.55;color:#e0e7ff;text-align:left">
      <b>🏆 高得点のコツ：</b> 敵・ボスを撃破／ライフを残す／ライフ満タン時に♥回復を取ると＋500
    </div>
    <button id="start">ゲーム開始</button>
    <div id="skillBox">✦ スキルアイテムを取ると「3方向弾」または「貫通弾」にパワーアップ！</div>
    <div class="small" style="margin-top:10px">操作：← → または A・Dで移動 ／ SPACEで発射</div>
  </div>
</div>
</div>

<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const overlay=document.getElementById("overlay"),startBtn=document.getElementById("start");
const title=document.getElementById("title"),message=document.getElementById("message");
const scoreEl=document.getElementById("score"),livesEl=document.getElementById("lives");
const stageHud={textContent:""},statusEl=document.getElementById("status"),timeHud=document.getElementById("timeHud");
const tutorial=document.getElementById("tutorial"),scoreGuide=document.getElementById("scoreGuide"),skillBox=document.getElementById("skillBox"),resultFX=document.getElementById("resultFX");

let state="menu",score=0,lives=3,last=0,raf=0;
let spawnTimer=0,shotTimer=0,invincible=0,itemTimer=5,invincibleKind="hit",invincibleFlash=0,guaranteedStarTimes=[],guaranteedStarIndex=0;
let stage=0,stageTime=0,stageBanner=0,stageBannerText="",stageBannerPhase=0;
let boss=null,bossBullets=[];
let skill="normal",skillTimer=0,skillName="通常弾";
let combo=0,comboTimer=0,nearMisses=0,stageKills=0,stageDamageTaken=false;
const keys=new Set(),bullets=[],enemies=[],items=[],particles=[],stars=[];
const player={x:W/2,y:H-75,w:34,h:38,speed:360};

for(let i=0;i<90;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2,v:30+Math.random()*80});

const STAGES=[
 {name:"一回戦",duration:20,enemyRate:.48,enemySpeed:96},
 {name:"二回戦",duration:30,enemyRate:.44,enemySpeed:140},
 {name:"ボス戦",duration:999,boss:true}
];

function resetGame(){
 score=0;lives=3;stage=0;stageTime=0;spawnTimer=.5;shotTimer=0;invincible=1.5;
 itemTimer=4;skill="normal";skillTimer=0;skillName="通常弾";
 combo=0;comboTimer=0;nearMisses=0;stageKills=0;stageDamageTaken=false;
 bullets.length=0;enemies.length=0;items.length=0;particles.length=0;bossBullets.length=0;boss=null;
 player.x=W/2;stageBanner=0;invincibleKind="hit";invincibleFlash=0;
 updateHud();
}
function updateHud(){
 scoreEl.textContent="SCORE "+score;
 livesEl.textContent="HP "+"♥".repeat(lives)+"♡".repeat(3-lives);
 stageHud.textContent=stage>0?STAGES[stage-1].name:"準備中";
 if(state==="playing"&&(stage===1||stage===2)){
  const remain=Math.max(0,STAGES[stage-1].duration-stageTime);
  timeHud.textContent=`TIME ${remain.toFixed(1)}s`;
 }else if(stage===3) timeHud.textContent="BOSS";
 else timeHud.textContent="TIME --";
 const skillText=skill==="normal"?"":`SKILL：${skillName} ${Math.ceil(skillTimer)}s`;
 const invText=invincible>0&&invincibleKind==="star"?`★ 無敵 ${invincible.toFixed(1)}s`:"";
 statusEl.textContent=[invText,skillText,combo>=2?`COMBO ×${combo}`:""].filter(Boolean).join("　");
}
function startGame(){
 clearResultDecor();tutorial.style.display="block";scoreGuide.style.display="block";skillBox.style.display="block";resultFX.style.display="none";
 resetGame();overlay.className="";overlay.style.display="none";state="stageIntro";beginStage(1);
 cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop);
}
function beginStage(n){
 stage=n;stageTime=0;stageBanner=n===3?3.0:2.35;stageBannerPhase=0;stageDamageTaken=false;
 guaranteedStarIndex=0;guaranteedStarTimes=[];
 if(stage===1){
  // 一回戦: 1個確定。序盤すぎ・終了直前を避けたランダム時刻。
  guaranteedStarTimes=[4+Math.random()*14];
 }else if(stage===2){
  // 二回戦: 2個確定。前半・後半から1個ずつランダムにし、偏りを防ぐ。
  guaranteedStarTimes=[3+Math.random()*9,16+Math.random()*9];
 }
 stageBannerText=STAGES[n-1].name.toUpperCase()+" START";
 stageHud.textContent=STAGES[n-1].name;
 enemies.length=0;items.length=0;bossBullets.length=0;
 if(n===3) boss={x:W/2,y:125,w:115,h:82,hp:90,maxHp:90,vx:150,fire:1.2,phase:0};
 state="stageIntro";
}
function showBonus(text){
 stageBannerText=text;stageBanner=1.4;stageBannerPhase=0;
}

function clearResultDecor(){
 document.querySelectorAll(".confetti,.spark,.ray,.failLine").forEach(e=>e.remove());
}
function buildClearFX(){
 clearResultDecor();
 resultFX.innerHTML='<div class="resultBig">🏆</div>';
 const colors=["#ffe45b","#ff5d8f","#64e7ff","#a77cff","#7cff91","#ffffff"];
 for(let i=0;i<42;i++){
  const e=document.createElement("i");e.className="confetti";
  e.style.left=((i*37)%100)+"vw";e.style.background=colors[i%colors.length];
  e.style.setProperty("--d",(2.8+(i%7)*.22)+"s");e.style.setProperty("--delay",(-i*.13)+"s");
  e.style.setProperty("--x",((-90+(i*47)%180))+"px");e.style.setProperty("--r",((i*71)%360)+"deg");
  overlay.appendChild(e);
 }
 for(let i=0;i<12;i++){
  const e=document.createElement("i");e.className="spark";
  e.style.left=(10+(i*29)%80)+"vw";e.style.top=(12+(i*43)%65)+"vh";
  e.style.setProperty("--delay",(i*.11)+"s");e.style.setProperty("--sx",(-70+(i*31)%140)+"px");e.style.setProperty("--sy",(-55+(i*53)%110)+"px");
  overlay.appendChild(e);
 }
 for(let i=0;i<12;i++){const r=document.createElement("i");r.className="ray";r.style.transform=`rotate(${i*30}deg)`;resultFX.appendChild(r)}
}
function buildGameOverFX(){
 clearResultDecor();
 resultFX.innerHTML='<div class="resultBig">⚠</div>';
 for(let i=0;i<8;i++){
  const e=document.createElement("i");e.className="failLine";
  e.style.top=((i*17)%100)+"vh";e.style.setProperty("--d",(2.6+(i%4)*.5)+"s");e.style.setProperty("--delay",(-i*.38)+"s");
  overlay.appendChild(e);
 }
}

function gameOver(){
 state="gameover";title.textContent="GAME OVER";
 message.innerHTML=`MISSION FAILED<br><span style="font-size:14px;color:#c7cbe0">SCORE ${score}　・　${STAGES[Math.max(0,stage-1)]?.name||""}まで到達<br>次はもっと先へ。もう一度挑戦しよう！</span>`;
 buildGameOverFX();resultFX.style.display="block";tutorial.style.display="none";scoreGuide.style.display="none";skillBox.style.display="none";
 overlay.className="overFX";startBtn.textContent="RETRY";overlay.style.display="flex";
}
function clearGame(){
 state="clear";title.textContent="GAME CLEAR!";
 message.innerHTML=`🎉 全ステージ突破！ 🎉<br><span style="font-size:15px;color:#fff4b0">SCORE ${score}</span><br><span style="font-size:13px">ボス撃破＋残りライフボーナス獲得！</span>`;
 buildClearFX();resultFX.style.display="block";tutorial.style.display="none";scoreGuide.style.display="none";skillBox.style.display="none";
 overlay.className="clearFX";startBtn.textContent="もう一度挑戦";overlay.style.display="flex";
}
function shoot(){
 if(state!=="playing" || shotTimer>0)return;
 const y=player.y-22;
 if(skill==="triple"){
   bullets.push({x:player.x,y,v:620,r:4,vx:0,damage:1});
   bullets.push({x:player.x,y,v:620,r:4,vx:-125,damage:1});
   bullets.push({x:player.x,y,v:620,r:4,vx:125,damage:1});
 }else if(skill==="laser"){
   bullets.push({x:player.x,y,v:900,r:5,vx:0,laser:true,damage:2,hitIds:[]});
 }else{
   bullets.push({x:player.x,y,v:620,r:4,vx:0,damage:1});
 }
 shotTimer=skill==="laser"?.32:skill==="triple"?.20:.16;
}
function spawnEnemy(){
 const type=Math.random()<.48?"rocket":"plane";
 const size=type==="rocket"?20:27;
 let count;
 if(stage===1){
  const progress=stageTime/STAGES[0].duration;
  const r=Math.random();
  // 空白時間を減らし、一回戦の中で敵密度がはっきり上昇する構成。
  if(progress<0.30) count=r<0.65?1:2;
  else if(progress<0.65) count=r<0.32?1:2;
  else count=r<0.12?1:(r<0.82?2:3);
 }else{
  count=stage===2&&type==="plane"?1+Math.floor(Math.random()*2):1+Math.floor(Math.random()*3);
 }
 const positions=[];let tries=0;
 while(positions.length<count&&tries++<30){
   const x=size+Math.random()*(W-size*2);
   if(positions.every(px=>Math.abs(px-x)>size*2.4))positions.push(x);
 }
 for(const x of positions){
   const hp=type==="rocket"?1:(stage===1?1:(stage===2?2:3));
   const speed=type==="rocket"?STAGES[stage-1].enemySpeed*1.8+Math.random()*35:STAGES[stage-1].enemySpeed*.72+Math.random()*25;
   enemies.push({x,y:-size*2,size,v:speed,hp,maxHp:hp,
    drift:type==="rocket"?0:(Math.random()-.5)*55,type,shoot:type==="plane"?(stage===1?99:(stage===2?1.8+Math.random()*0.8:1.1+Math.random()*0.8)):99});
 }
}
function spawnItem(x,y,type){
 items.push({x,y,size:15,v:90+Math.random()*35,type,spin:Math.random()*7});
}
function dropFromEnemy(x,y){
 // スキルは敵撃破時だけ出現。ハート・無敵も低確率でドロップ
 const roll=Math.random();
 // 敵撃破時のアイテムは一・二回戦とも大幅に減らす。
 // 一回戦: 合計8% / 二回戦: 合計10%。ボス戦は従来設定を維持。
 if(stage===1){
  if(roll<.025)spawnItem(x,y,"skill");
  else if(roll<.05)spawnItem(x,y,"heart");
  else if(roll<.055)spawnItem(x,y,"star"); // 無敵 0.5%
 }else if(stage===2){
  if(roll<.03)spawnItem(x,y,"skill");
  else if(roll<.065)spawnItem(x,y,"heart");
  else if(roll<.07)spawnItem(x,y,"star"); // 無敵 0.5%
 }else{
  if(roll<.10)spawnItem(x,y,"skill");
  else if(roll<.19)spawnItem(x,y,"heart");
  else if(roll<.31)spawnItem(x,y,"star");
 }
}
function burst(x,y,n=10){
 for(let i=0;i<n;i++){
  const a=Math.random()*Math.PI*2,v=40+Math.random()*180;
  particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.5});
 }
}
function hitPlayer(){
 if(invincible>0)return;
 lives--;stageDamageTaken=true;invincible=1.4;invincibleKind="hit";invincibleFlash=1.4;burst(player.x,player.y,20);updateHud();
 if(lives<=0)gameOver();
}
function circleRect(cx,cy,r,rx,ry,rw,rh){
 const x=Math.max(rx,Math.min(cx,rx+rw)),y=Math.max(ry,Math.min(cy,ry+rh));
 return (cx-x)**2+(cy-y)**2<r*r;
}
function applyItem(it){
 burst(it.x,it.y,16);
 if(it.type==="heart"){
   if(lives>=3){score+=500;showBonus("FULL LIFE HEART +500");}
   else lives=Math.min(3,lives+1);
  }
 else if(it.type==="star"){invincible=6;invincibleKind="star";invincibleFlash=0;burst(player.x,player.y,32);}
 else{
   const skills=["triple","laser"];
   skill=skills[Math.floor(Math.random()*skills.length)];
   skillTimer=skill==="triple"?5:10;
   skillName=skill==="triple"?"3方向弾":"貫通弾";
 }
 updateHud();
}
function update(dt){
 for(const s of stars){s.y+=s.v*dt;if(s.y>H)s.y=0}
 if(state==="stageIntro"){
   stageBanner-=dt;stageBannerPhase+=dt;
   if(stageBanner<=0)state="playing";
   return;
 }
 if(state!=="playing")return;
 invincible=Math.max(0,invincible-dt);invincibleFlash=Math.max(0,invincibleFlash-dt);shotTimer=Math.max(0,shotTimer-dt);
 if(invincible<=0)invincibleKind="none";updateHud();
 comboTimer=Math.max(0,comboTimer-dt);if(comboTimer<=0)combo=0;
 if(skillTimer>0){skillTimer-=dt;if(skillTimer<=0){skill="normal";skillName="通常弾";updateHud();}}
 let dx=0;if(keys.has("ArrowLeft")||keys.has("a")||keys.has("A"))dx--;if(keys.has("ArrowRight")||keys.has("d")||keys.has("D"))dx++;
 player.x+=dx*player.speed*dt;player.x=Math.max(24,Math.min(W-24,player.x));
 if(keys.has(" ")||keys.has("Spacebar"))shoot();

 stageTime+=dt;
 if(stage<3){
   spawnTimer-=dt;
   if(spawnTimer<=0){spawnEnemy();spawnTimer=Math.max(STAGES[stage-1].enemyRate,.26);}

   if(stageTime>=STAGES[stage-1].duration){
     beginStage(stage+1);return;
   }
 }else{
   updateBoss(dt);
 }

 itemTimer-=dt;
 // 各ラウンドの確定★無敵アイテム。通常の定期アイテムとは別枠。
 if((stage===1||stage===2)&&guaranteedStarIndex<guaranteedStarTimes.length&&stageTime>=guaranteedStarTimes[guaranteedStarIndex]){
   items.push({x:25+Math.random()*(W-50),y:-20,size:16,v:100+Math.random()*30,type:"star",spin:0});
   guaranteedStarIndex++;
 }
 if(itemTimer<=0){
   // 一回戦だけ少し救済を厚くする。二回戦・ボス戦は従来値を維持。
   itemTimer=stage===1?(5.5+Math.random()*2.5):(6+Math.random()*4);
   // 上から流れる無敵アイテムも一・二回戦ではかなりレアにする。
   // 一回戦: 回復92% / 無敵8%、二回戦: 回復90% / 無敵10%、ボス戦は従来55% / 45%。
   const heartRate=stage===1?.92:(stage===2?.90:.55);
   // 上から流れる定期アイテムは回復か無敵。スキルは敵撃破ドロップ限定
   items.push({x:25+Math.random()*(W-50),y:-20,size:16,v:100+Math.random()*30,type:Math.random()<heartRate?"heart":"star",spin:0});
 }

 for(let i=bullets.length-1;i>=0;i--){
   const b=bullets[i];b.y-=b.v*dt;b.x+=(b.vx||0)*dt;
   if(b.y<-30||b.x<-30||b.x>W+30){bullets.splice(i,1);continue}
   let removeBullet=false;
   for(let j=enemies.length-1;j>=0;j--){
    const e=enemies[j];
    if(circleRect(b.x,b.y,b.r,e.x-e.size,e.y-e.size,e.size*2,e.size*2)){
     if(b.laser){if(b.hitIds.includes(e))continue;b.hitIds.push(e);}
     e.hp-=b.damage||1;burst(b.x,b.y,5);
     if(e.hp<=0){
       score+=e.maxHp*100;stageKills++;combo=0;comboTimer=0;
       burst(e.x,e.y,14);dropFromEnemy(e.x,e.y);enemies.splice(j,1);updateHud();
     }
     if(!b.laser){bullets.splice(i,1);removeBullet=true;break;}
    }
   }
   if(removeBullet)continue;
   if(boss&&circleRect(b.x,b.y,b.r,boss.x-boss.w/2,boss.y-boss.h/2,boss.w,boss.h)&&(!b.laser||!b.hitBoss)){
    boss.hp-=b.damage||1;score+=b.laser?8:5;burst(b.x,b.y,4);
    if(b.laser)b.hitBoss=true;
    if(!b.laser)bullets.splice(i,1);
    if(boss.hp<=0){
      burst(boss.x,boss.y,70);
      const bossBonus=5000,lifeBonus=lives*1000;
      score+=bossBonus+lifeBonus;
      boss=null;clearGame();
    }
    updateHud();
   }
 }
 for(let i=enemies.length-1;i>=0;i--){
   const e=enemies[i];e.y+=e.v*dt;e.x+=e.drift*dt;
   if(e.x<e.size||e.x>W-e.size)e.drift*=-1;
   e.x=Math.max(e.size,Math.min(W-e.size,e.x));
   e.shoot-=dt;
   if(e.type==="plane"&&e.shoot<=0&&e.y>0&&e.y<H*.7){enemyShoot(e);e.shoot=stage===2?1.8+Math.random()*0.8:1.1+Math.random()*0.8}
   if(e.y>H+60){enemies.splice(i,1);continue}
   if(circleRect(e.x,e.y,e.size*.72,player.x-player.w/2,player.y-player.h/2,player.w,player.h)){enemies.splice(i,1);hitPlayer();}
 }
 for(let i=items.length-1;i>=0;i--){
   const it=items[i];it.y+=it.v*dt;it.spin+=dt*4;
   if(it.y>H+30){items.splice(i,1);continue}
   if(circleRect(it.x,it.y,it.size,player.x-player.w/2,player.y-player.h/2,player.w,player.h)){applyItem(it);items.splice(i,1);}
 }
 for(let i=bossBullets.length-1;i>=0;i--){
   const b=bossBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
   if(b.y>H+20||b.x<-20||b.x>W+20){bossBullets.splice(i,1);continue}
   if(circleRect(b.x,b.y,b.r,player.x-player.w/2,player.y-player.h/2,player.w,player.h)){bossBullets.splice(i,1);hitPlayer();}
 }
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
}
function enemyShoot(e){
 const dx=player.x-e.x,dy=player.y-e.y,len=Math.hypot(dx,dy)||1;
 bossBullets.push({x:e.x,y:e.y+e.size,vx:dx/len*180,vy:dy/len*180,r:5});
}
function updateBoss(dt){
 if(!boss)return;
 boss.phase+=dt;boss.x+=boss.vx*dt;
 if(boss.x<boss.w/2||boss.x>W-boss.w/2)boss.vx*=-1;
 boss.fire-=dt;
 if(boss.fire<=0){
   boss.fire=1.0;
   for(let i=-2;i<=2;i++){
     const a=Math.PI/2+i*.17;
     bossBullets.push({x:boss.x,y:boss.y+boss.h/2,vx:Math.cos(a)*180,vy:Math.sin(a)*180,r:6});
   }
 }
}
function drawRocket(e){
 ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.PI);
 ctx.fillStyle="#d83d4f";ctx.beginPath();ctx.moveTo(0,-e.size*1.25);ctx.quadraticCurveTo(e.size*.9,-e.size*.2,e.size*.58,e.size);ctx.lineTo(-e.size*.58,e.size);ctx.quadraticCurveTo(-e.size*.9,-e.size*.2,0,-e.size*1.25);ctx.fill();
 ctx.fillStyle="#ffd84d";ctx.beginPath();ctx.arc(0,-e.size*.35,e.size*.28,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#ff8b32";ctx.beginPath();ctx.moveTo(-7,e.size*.85);ctx.lineTo(0,e.size*1.45+Math.random()*7);ctx.lineTo(7,e.size*.85);ctx.fill();
 ctx.restore();
}
function drawPlane(e){
 ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.sin(e.y*.02)*.08);
 ctx.fillStyle="#6b83e8";ctx.beginPath();ctx.moveTo(0,-e.size*1.05);ctx.lineTo(e.size*.32,-e.size*.1);ctx.lineTo(e.size*1.05,e.size*.7);ctx.lineTo(e.size*.35,e.size*.52);ctx.lineTo(0,e.size*1.0);ctx.lineTo(-e.size*.35,e.size*.52);ctx.lineTo(-e.size*1.05,e.size*.7);ctx.lineTo(-e.size*.32,-e.size*.1);ctx.closePath();ctx.fill();
 ctx.fillStyle="#d7efff";ctx.beginPath();ctx.ellipse(0,-e.size*.22,e.size*.23,e.size*.38,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#ff5968";ctx.fillRect(-e.size*.8,e.size*.54,e.size*.22,e.size*.12);ctx.fillRect(e.size*.58,e.size*.54,e.size*.22,e.size*.12);
 ctx.restore();
}
function drawItem(it){
 ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.spin);
 ctx.shadowBlur=14;
 if(it.type==="heart"){
  ctx.shadowColor="#ff4b79";ctx.fillStyle="#ff4b79";ctx.beginPath();ctx.moveTo(0,12);ctx.bezierCurveTo(-20,-1,-13,-14,-4,-10);ctx.bezierCurveTo(0,-18,13,-14,4,-1);ctx.bezierCurveTo(13,-14,20,-1,0,12);ctx.fill();
 }else if(it.type==="star"){
  ctx.shadowColor="#ffe85b";ctx.fillStyle="#ffe85b";drawStar(0,0,16,7,5);
 }else{
  ctx.shadowColor="#8cf4ff";ctx.fillStyle="#8cf4ff";drawStar(0,0,16,6,6);
 }
 ctx.shadowBlur=0;ctx.restore();
}
function drawStar(x,y,r,R,n){
 ctx.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rr=i%2?r:R;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill();
}
function drawBoss(){
 if(!boss)return;
 ctx.save();ctx.translate(boss.x,boss.y);
 ctx.fillStyle="#8a4dcb";ctx.beginPath();ctx.moveTo(0,-boss.h/2);ctx.lineTo(boss.w/2,boss.h*.2);ctx.lineTo(boss.w*.32,boss.h/2);ctx.lineTo(0,boss.h*.25);ctx.lineTo(-boss.w*.32,boss.h/2);ctx.lineTo(-boss.w/2,boss.h*.2);ctx.closePath();ctx.fill();
 ctx.fillStyle="#ffcf4a";ctx.beginPath();ctx.arc(0,0,16+Math.sin(boss.phase*5)*2,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff";ctx.fillRect(-boss.w*.72,-boss.h*.72,boss.w*1.44,7);
 ctx.fillStyle="#ff4b5c";ctx.fillRect(-boss.w*.72,-boss.h*.72,boss.w*1.44*(boss.hp/boss.maxHp),7);
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#030516");g.addColorStop(1,"#0a1030");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#fff";for(const s of stars){ctx.globalAlpha=.35+s.s*.2;ctx.fillRect(s.x,s.y,s.s,s.s*2)}ctx.globalAlpha=1;
 for(const b of bullets){ctx.fillStyle=b.laser?"#b7ffff":"#8cf4ff";ctx.shadowBlur=b.laser?12:0;ctx.shadowColor="#8cf4ff";ctx.fillRect(b.x-(b.laser?3:b.r),b.y-(b.laser?14:b.r),b.laser?6:b.r*2,b.laser?28:b.r*2);ctx.shadowBlur=0}
 for(const e of enemies)e.type==="rocket"?drawRocket(e):drawPlane(e);
 for(const it of items)drawItem(it);
 for(const b of bossBullets){ctx.fillStyle="#ff6685";ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}
 drawBoss();
 const starShield=invincible>0&&invincibleKind==="star";
 if(invincibleKind!=="hit"||invincible<=0||Math.floor(invincible*12)%2===0){
  ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle=starShield?"#ffe34f":"#63d7ff";
  ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(18,18);ctx.lineTo(0,11);ctx.lineTo(-18,18);ctx.closePath();ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,-5,5,0,7);ctx.fill();
  ctx.fillStyle=starShield?"#ffd83d":"#ffb34d";ctx.beginPath();ctx.moveTo(-7,15);ctx.lineTo(0,30+Math.random()*8);ctx.lineTo(7,15);ctx.fill();ctx.restore();
 }
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*1.5);ctx.fillStyle="#ffd36a";ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1;
 if(state==="stageIntro")drawStageBanner();
}
function drawStageBanner(){
 const t=stageBannerPhase,fade=Math.min(1,t/.35,stageBanner/.35);
 ctx.save();
 if(stage===3){
  const flash=Math.sin(t*22)>0;
  ctx.globalAlpha=.22*fade;ctx.fillStyle=flash?"#ff1e3c":"#42000b";ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.95*fade;ctx.fillStyle="#ff2948";ctx.fillRect(0,80, W,8);ctx.fillRect(0,H-88,W,8);
  ctx.fillStyle="#180007";ctx.fillRect(0,H/2-91,W,182);
  ctx.strokeStyle="#ff3855";ctx.lineWidth=3;ctx.strokeRect(8,H/2-82,W-16,164);
  ctx.textAlign="center";ctx.shadowBlur=25;ctx.shadowColor="#ff1738";
  ctx.fillStyle="#ff3654";ctx.font="900 23px system-ui";ctx.fillText("⚠ EMERGENCY ALERT ⚠",W/2,H/2-48);
  ctx.fillStyle="#fff";ctx.font="1000 51px system-ui";ctx.fillText("BOSS BATTLE",W/2,H/2+12);
  ctx.font="900 20px system-ui";ctx.fillStyle="#ffcf58";ctx.fillText("最終決戦 — 強敵を撃破せよ！",W/2,H/2+51);
  ctx.shadowBlur=0;ctx.font="800 13px system-ui";ctx.fillStyle="#ff8ca0";ctx.fillText("WARNING  •  WARNING  •  WARNING",W/2,H/2+76);
 }else{
  const p=Math.min(1,t/.6),scale=.72+p*.28;
  ctx.translate(W/2,H/2);ctx.scale(scale,scale);ctx.globalAlpha=fade;
  ctx.fillStyle="rgba(10,18,54,.82)";ctx.fillRect(-W/2,-72,W,144);
  ctx.fillStyle="#8cf4ff";ctx.fillRect(-150,-55,300,3);ctx.fillRect(-150,52,300,3);
  ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="900 18px system-ui";ctx.fillText(stage===1?"MISSION 01":"MISSION 02",0,-30);
  ctx.font="1000 48px system-ui";ctx.shadowBlur=28;ctx.shadowColor="#5b7cff";ctx.fillText(stageBannerText,0,20);
  ctx.shadowBlur=0;ctx.font="700 15px system-ui";ctx.fillStyle="#d9e2ff";ctx.fillText(stage===1?"まずは敵の動きを見極めろ！":"敵の攻撃に注意して突破せよ！",0,48);
 }
 ctx.restore();
}
function loop(t){
 const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();
 if(state!=="menu"&&state!=="gameover"&&state!=="clear")raf=requestAnimationFrame(loop);else raf=0;
}
window.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," ","a","d","A","D"].includes(e.key))e.preventDefault();
 keys.add(e.key);if(e.key==="Enter"&&(state==="menu"||state==="gameover"||state==="clear"))startGame();
});
window.addEventListener("keyup",e=>keys.delete(e.key));
startBtn.addEventListener("click",startGame);
canvas.addEventListener("pointerdown",e=>{
 if(state==="playing"){const r=canvas.getBoundingClientRect();player.x=(e.clientX-r.left)/r.width*W;shoot();}
});
canvas.addEventListener("pointermove",e=>{
 if(state==="playing"&&e.buttons){const r=canvas.getBoundingClientRect();player.x=(e.clientX-r.left)/r.width*W;player.x=Math.max(24,Math.min(W-24,player.x));shoot();}
});
draw();
</script>
</body>
